<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heart Journey</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    overflow:hidden;
    font-family:Poppins,sans-serif;
}

#container{
    position:relative;
    width:100vw;
    height:100vh;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.milestone{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#ff4d6d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    cursor:pointer;
    transform:translate(-50%,-50%);
    z-index:5;
    box-shadow:0 0 20px rgba(255,77,109,.5);
}

#modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
}

#modal.active{
    display:flex;
}

.modal-box{
    background:#1f1f1f;
    color:white;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:500px;
}
</style>
</head>
<body>

<div id="container">
    <canvas id="canvas"></canvas>
</div>

<div id="modal">
    <div class="modal-box">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
    </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const car = new Image();
car.src = "mobilwd.png";

/*
HEART CURVE
x = 16 sin³(t)
y = 13 cos(t)-5 cos(2t)-2 cos(3t)-cos(4t)
*/

const path = [];

function buildHeart(){

    path.length = 0;

    for(let t=0;t<=Math.PI*2;t+=0.015){

        let x =
            16*Math.pow(Math.sin(t),3);

        let y =
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        x *= 22;
        y *= 22;

        path.push({
            x:W/2 + x,
            y:H/2 - y
        });
    }
}

buildHeart();

const milestones = [
    {index:40,title:"Pertama Komunikasi"},
    {index:90,title:"Pertemuan"},
    {index:160,title:"Tunangan"},
    {index:240,title:"Lamaran"},
    {index:320,title:"Prewedding"},
    {index:390,title:"Wedding"}
];

function createMilestones(){

    document
    .querySelectorAll(".milestone")
    .forEach(e=>e.remove());

    milestones.forEach((m,i)=>{

        const p = path[m.index];

        const div = document.createElement("div");

        div.className = "milestone";
        div.innerHTML = i+1;

        div.style.left = p.x+"px";
        div.style.top = p.y+"px";

        div.onclick = ()=>{

            document
            .getElementById("modal")
            .classList.add("active");

            document
            .getElementById("modalTitle")
            .innerText = m.title;

            document
            .getElementById("modalText")
            .innerText =
            "Detail perjalanan cinta.";

        };

        document
        .getElementById("container")
        .appendChild(div);

    });

}

createMilestones();

document
.getElementById("modal")
.onclick = ()=>{
    document
    .getElementById("modal")
    .classList.remove("active");
};

let progress = 0;

function drawHeart(){

    ctx.beginPath();

    for(let i=0;i<path.length;i++){

        const p = path[i];

        if(i===0){
            ctx.moveTo(p.x,p.y);
        }else{
            ctx.lineTo(p.x,p.y);
        }
    }

    ctx.strokeStyle="#ff4d6d";
    ctx.lineWidth=5;
    ctx.stroke();
}

function drawCar(){

    const p = path[Math.floor(progress)];

    const next =
        path[
            (Math.floor(progress)+1)
            % path.length
        ];

    const angle =
        Math.atan2(
            next.y-p.y,
            next.x-p.x
        );

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(angle);

    if(car.complete){

        ctx.drawImage(
            car,
            -35,
            -20,
            70,
            40
        );

    }else{

        ctx.font="32px sans-serif";
        ctx.fillText("🚗",-16,0);

    }

    ctx.restore();
}

function animate(){

    ctx.clearRect(0,0,W,H);

    drawHeart();

    drawCar();

    progress += 0.45;

    if(progress >= path.length){
        progress = 0;
    }

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{

    buildHeart();

    createMilestones();

});

</script>

</body>
</html>
