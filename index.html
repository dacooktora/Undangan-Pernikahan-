 <!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History Journey 3D</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; font-family: Arial, sans-serif; background:#000; }#ui {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
  color: white;
}

.card {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  padding: 15px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  color: white;
  display: none;
}

.card video {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

canvas { display:block; }

  </style>
</head>
<body><div id="ui">🎬 Wedding History Journey</div><div id="card" class="card">
  <h3 id="title">Moment</h3>
  <video id="video" controls autoplay></video>
</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script>
// Scene setup
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 5, 50);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,7);
scene.add(light);

// Ocean plane
const waterGeo = new THREE.PlaneGeometry(200,200);
const waterMat = new THREE.MeshStandardMaterial({ color:0x001133 });
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
scene.add(water);

// Boat (simple placeholder)
const boatGeo = new THREE.BoxGeometry(1,0.5,2);
const boatMat = new THREE.MeshStandardMaterial({ color:0xffcc99 });
const boat = new THREE.Mesh(boatGeo, boatMat);
boat.position.y = 0.5;
scene.add(boat);

// Path points (timeline)
const points = [
  { x:0, z:0, title:"Ketemu", video:"video1.mp4" },
  { x:5, z:-5, title:"Pacaran", video:"video2.mp4" },
  { x:10, z:-10, title:"Tunangan", video:"video3.mp4" },
  { x:15, z:-15, title:"Lamaran", video:"video4.mp4" },
  { x:20, z:-20, title:"Menikah", video:"video5.mp4" }
];

let index = 0;
const card = document.getElementById("card");
const title = document.getElementById("title");
const video = document.getElementById("video");

function moveBoat(i){
  const p = points[i];

  gsap.to(boat.position, {
    x: p.x,
    z: p.z,
    duration: 3,
    ease: "power2.inOut",
    onUpdate: () => {
      camera.position.x = boat.position.x;
      camera.position.z = boat.position.z + 8;
      camera.lookAt(boat.position);
    },
    onComplete: () => {
      showCard(p);
    }
  });
}

function showCard(p){
  card.style.display = "block";
  title.innerText = p.title;
  video.src = p.video;
  video.play();

  setTimeout(() => {
    card.style.display = "none";
    index++;
    if(index < points.length) moveBoat(index);
  }, 4000);
}

moveBoat(0);

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script></body>
</html>
